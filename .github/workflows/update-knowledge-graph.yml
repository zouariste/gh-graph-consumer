name: Assemble knowledge graph

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  repository_dispatch:
    types: [project-graph-published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shared-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      # Public github.com: the per-job GITHUB_TOKEN CANNOT read another repo's
      # artifacts. GRAPH_READ_TOKEN must be a PAT with read access to the
      # producer repo's Actions (classic: repo + read:actions; fine-grained:
      # Actions:read + Contents:read on the producer).
      GH_HOST: github.com
      GH_TOKEN: ${{ secrets.GRAPH_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tools
        run: |
          python -m venv .venv-graphify
          .venv-graphify/bin/python -m pip install -r requirements-graphify.txt
      - name: Fetch, validate, and assemble shared graph
        run: |
          test -n "$GH_TOKEN"
          .venv-graphify/bin/python scripts/shared_graph.py sync --registry config/projects.json
      - name: Publish assembled graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphify-shared-baseline
          path: |
            graphify-out/graph.json
            graphify-out/manifest.json
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 60
      - name: Summarize selected revisions
        run: cat graphify-out/GRAPH_REPORT.md >> "$GITHUB_STEP_SUMMARY"
